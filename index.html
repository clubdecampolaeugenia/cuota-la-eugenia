<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d6663">
  <link rel="apple-touch-icon" href="https://i.imgur.com/UBdZJFW.png">
  <link rel="icon" type="image/png" href="https://i.imgur.com/UBdZJFW.png">
  <title>Cuota vigente</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0d6663; font-family: 'Roboto', sans-serif; padding: 20px; }

    @keyframes fadeInScreen {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      60% { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes fadeInOverlay {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .card { width: 100%; max-width: 430px; background: #c4df57; color: #003a6b; border-radius: 24px; padding: 22px 20px; text-align: center; box-sizing: border-box; box-shadow: 0 10px 28px rgba(0,0,0,0.4); animation: fadeInScreen 0.3s ease-out; }
    .logo-wrap img { width: 198px; height: auto; display: block; margin: auto; filter: drop-shadow(0 4px 7px rgba(0,0,0,0.2)); }
    h1 { margin: 8px 0 0; color: #000000; font-family: Impact, sans-serif; font-size: 34px; line-height: 0.95; letter-spacing: 1px; text-transform: uppercase; }
    @media (max-width: 380px) { h1 { font-size: 28px; } .amount { font-size: 17px !important; } }
    .dato { background: #edf1dc; border-radius: 14px; padding: 12px; margin: 12px 0; }
    .dato-titulo { color: #003a6b; font-size: 14px; font-weight: 900; text-transform: uppercase; }
    .amount { margin-top: 4px; color: #003a6b; font-size: 20px; font-weight: 900; }

    .copyBtn, .backButton {
      display: block;
      width: 100%;
      max-width: 480px;
      margin: 10px auto 0;
      border-radius: 10px;
      padding: 14px;
      font-family: Impact, sans-serif;
      font-size: 1rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      box-sizing: border-box;
      text-align: center;
      text-decoration: none;
      border: 2px solid transparent;
      cursor: pointer;
    }
    .copyBtn { border-color: #0d6663; color: #0d6663; background: transparent; }
    .backButton { background: #0a4f4d; border-color: #0a4f4d; color: #c4df57; }
    .copyBtn:hover { background: #0d6663; color: #c4df57; }
    .backButton:hover { background: #0a3d3b; }
    .copyBtn, .backButton { transition: transform 0.08s, box-shadow 0.08s, background 0.15s, color 0.15s; }
    .copyBtn:active, .backButton:active {
      transform: scale(0.96);
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    }

    .footer { margin-top: 16px; font-size: 12px; color: #003a6b; line-height: 1.5; }

    /* MODAL ALIAS COPIADO */
    @keyframes fadeOutOverlay {
      from { opacity: 1; }
      to { opacity: 0; }
    }
    .overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.3);
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding-top: 60px;
      z-index: 999;
    }
    .overlay.show { display: flex; animation: fadeInOverlay 0.25s ease-out; }
    .overlay.hide { display: flex; animation: fadeOutOverlay 0.3s ease-in forwards; }
    @media (min-width: 600px) {
      .overlay { align-items: center; padding-top: 0; }
    }
    .modal-card {
      background: #0d6663;
      padding: 28px 24px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 10px 28px rgba(0,0,0,0.4);
      max-width: 320px;
      width: 90%;
      animation: fadeInScreen 0.3s ease-out;
    }
    .check-icon {
      font-size: 48px;
      margin-bottom: 8px;
      visibility: hidden;
    }
    .check-icon.show {
      visibility: visible;
      display: inline-block;
      animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .modal-titulo {
      margin: 0 0 12px;
      color: #c4df57;
      font-family: Impact, sans-serif;
      font-size: 22px;
      letter-spacing: 1px;
      text-transform: uppercase;
      min-height: 26px;
    }
    .modal-alias {
      font-weight: 900;
      font-size: 17px;
      margin: 10px 0 0;
      color: #003a6b;
      background: #edf1dc;
      border-radius: 14px;
      padding: 12px 14px;
      word-break: break-word;
      white-space: normal;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-wrap">
      <img src="https://i.imgur.com/UBdZJFW.png" alt="Logo La Eugenia">
    </div>
    <h1 id="titulo">Cargando...</h1>
    <div class="dato">
      <div class="dato-titulo">Cuota Lote</div>
      <div class="amount" id="lote"></div>
    </div>
    <div class="dato">
      <div class="dato-titulo">Cuota Lote Adicional</div>
      <div class="amount" id="adicional"></div>
    </div>
    <button class="copyBtn" onclick="copiarAlias()">Copiar alias de La Eugenia</button>
    <a class="backButton" href="https://clubdecampolaeugenia.taplink.site/">Ir al Centro de Gestión Vecinal</a>
    <div class="footer" id="actualizacion"></div>
  </div>

  <div class="overlay" id="overlay">
    <div class="modal-card">
      <div class="check-icon" id="check">✅</div>
      <h2 class="modal-titulo" id="modalTitulo">Copiando...</h2>
      <div class="modal-alias">DELFIN.COCINA.MANTO</div>
    </div>
  </div>

  <script>
    const DATA_URL = "https://script.google.com/macros/s/AKfycbz5gcfgjTNLm94jSdSGcVCiM8WP2673S1cGj9uCCq6XehVlLLJ2Q9OgPaVaSNrvceE7/exec";
    fetch(DATA_URL)
      .then(res => res.text())
      .then(text => {
        const p = text.split("|");
        document.getElementById("titulo").innerText = p[0] || "";
        document.getElementById("lote").innerText = (p[1] || "").replace(/^LOTE:\s*/i, "");
        document.getElementById("adicional").innerText = (p[2] || "").replace(/^LOTE ADICIONAL:\s*/i, "");
        document.getElementById("actualizacion").innerText = p[3] || "";
      })
      .catch(() => { document.getElementById("titulo").innerText = "Error cargando datos"; });

    function reproducirSonido() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1320, ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.25);
      } catch(e) {}
    }

    function copiarAlias() {
      const alias = "DELFIN.COCINA.MANTO";
      navigator.clipboard.writeText(alias);

      const overlay = document.getElementById('overlay');
      const check = document.getElementById('check');
      const titulo = document.getElementById('modalTitulo');

      check.classList.remove('show');
      titulo.innerText = 'Copiando...';
      overlay.classList.add('show');

      setTimeout(() => {
        reproducirSonido();
        check.classList.add('show');
        titulo.innerText = 'Alias copiado';
      }, 450);

      setTimeout(() => {
        overlay.classList.remove('show');
        overlay.classList.add('hide');
      }, 1800);

      setTimeout(() => {
        overlay.classList.remove('hide');
      }, 2100);
    }
  </script>
</body>
</html>
